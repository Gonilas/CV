<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gonilas - Business Card</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 40px 30px;
            text-align: center;
            color: white;
        }

        .profile-pic {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            border: 3px solid white;
        }

        .profile-pic img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .title {
            font-size: 14px;
            opacity: 0.9;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .content {
            padding: 40px 30px;
        }

        .section {
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 12px;
            text-transform: uppercase;
            color: #667eea;
            letter-spacing: 1px;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .contact-info {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            padding: 10px;
            background: #f8f9ff;
            border-radius: 8px;
            text-decoration: none;
            color: #333;
            transition: all 0.3s ease;
        }

        .contact-info:hover {
            background: #667eea;
            color: white;
            transform: translateX(5px);
        }

        .contact-icon {
            font-size: 20px;
            margin-right: 12px;
            width: 30px;
            text-align: center;
        }

        .contact-text {
            font-size: 14px;
        }

        .social-links {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .social-link {
            aspect-ratio: 1;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            text-decoration: none;
            transition: all 0.3s ease;
            background: #f8f9ff;
        }

        .social-link:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        .social-link.linkedin {
            background: linear-gradient(135deg, #0a66c2 0%, #084a8d 100%);
            color: white;
        }

        .social-link.wechat {
            background: linear-gradient(135deg, #09b83e 0%, #057a2e 100%);
            color: white;
        }

        .social-link.github {
            background: linear-gradient(135deg, #333 0%, #000 100%);
            color: white;
        }

        .social-link.email {
            background: linear-gradient(135deg, #f57c00 0%, #c25000 100%);
            color: white;
        }

        .btn {
            display: inline-block;
            padding: 12px 24px;
            margin-top: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            width: 100%;
            text-align: center;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .footer {
            text-align: center;
            padding: 20px;
            font-size: 12px;
            color: #999;
            border-top: 1px solid #f0f0f0;
        }

        @media (max-width: 480px) {
            .header {
                padding: 30px 20px;
            }

            .content {
                padding: 30px 20px;
            }

            h1 {
                font-size: 24px;
            }

            .profile-pic {
                width: 100px;
                height: 100px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="profile-pic">
                👤
            </div>
            <h1>Gonilas</h1>
            <p class="title">Software Developer</p>
        </div>

        <div class="content">
            <!-- Contact Information -->
            <div class="section">
                <div class="section-title">📋 Contact</div>
                <a href="mailto:your-email@example.com" class="contact-info">
                    <span class="contact-icon">✉️</span>
                    <span class="contact-text">your-email@example.com</span>
                </a>
                <a href="tel:+1234567890" class="contact-info">
                    <span class="contact-icon">📱</span>
                    <span class="contact-text">+1 (234) 567-890</span>
                </a>
            </div>

            <!-- Social Links -->
            <div class="section">
                <div class="section-title">🔗 Connect</div>
                <div class="social-links">
                    <a href="https://www.linkedin.com/in/yourprofile" target="_blank" class="social-link linkedin" title="LinkedIn">in</a>
                    <a href="https://github.com/Gonilas" target="_blank" class="social-link github" title="GitHub">gh</a>
                    <a href="https://wechat.com" target="_blank" class="social-link wechat" title="WeChat">wc</a>
                    <a href="mailto:your-email@example.com" class="social-link email" title="Email">@</a>
                </div>
            </div>

            <!-- Resume Section -->
            <div class="section">
                <a href="resume.pdf" class="btn" download>📄 Download Resume</a>
            </div>
        </div>

        <div class="footer">
            <p>Built with ❤️ using GitHub Pages</p>
        </div>
    </div>
</body>
</html>
