<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filippov Danil - Software Developer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 40px 30px;
            text-align: center;
            color: white;
        }

        .profile-pic {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 4px solid white;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.1);
        }

        .profile-pic img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .title {
            font-size: 14px;
            opacity: 0.9;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .content {
            padding: 40px 30px;
        }

        .section {
            margin-bottom: 35px;
        }

        .section-title {
            font-size: 11px;
            text-transform: uppercase;
            color: #667eea;
            letter-spacing: 1.5px;
            margin-bottom: 15px;
            font-weight: 700;
        }

        /* Contact Info Styles */
        .contact-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .contact-item {
            padding: 12px;
            background: #f8f9ff;
            border-radius: 10px;
            text-decoration: none;
            color: #333;
            transition: all 0.3s ease;
            border: 1px solid #e8eaff;
        }

        .contact-item:hover {
            background: #667eea;
            color: white;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
        }

        .contact-icon {
            font-size: 24px;
            margin-bottom: 8px;
            display: block;
        }

        .contact-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.8;
            font-weight: 600;
        }

        .contact-value {
            font-size: 13px;
            margin-top: 4px;
            font-weight: 500;
        }

        /* Social Links */
        .social-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .social-link {
            aspect-ratio: 1;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            text-decoration: none;
            transition: all 0.3s ease;
            background: #f8f9ff;
            border: 1px solid #e8eaff;
            gap: 6px;
            cursor: pointer;
        }

        .social-link span {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .social-link:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15);
        }

        .social-link.linkedin {
            background: linear-gradient(135deg, #0a66c2 0%, #084a8d 100%);
            color: white;
        }

        .social-link.wechat {
            background: linear-gradient(135deg, #09b83e 0%, #057a2e 100%);
            color: white;
        }

        .social-link.telegram {
            background: linear-gradient(135deg, #0088cc 0%, #0066aa 100%);
            color: white;
        }

        /* QR Code Section */
        .qr-container {
            display: flex;
            justify-content: center;
            padding: 20px;
            background: #f8f9ff;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .qr-code {
            max-width: 150px;
            width: 100%;
            border-radius: 8px;
            border: 2px solid #667eea;
            padding: 8px;
            background: white;
        }

        .qr-label {
            font-size: 11px;
            text-align: center;
            color: #667eea;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 8px;
        }

        /* Buttons */
        .btn {
            display: inline-block;
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            width: 100%;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .footer {
            text-align: center;
            padding: 20px;
            font-size: 12px;
            color: #999;
            border-top: 1px solid #f0f0f0;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.3s;
        }

        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            border-radius: 15px;
            text-align: center;
            max-width: 90vw;
            max-height: 90vh;
            animation: slideUp 0.3s;
            overflow: auto;
        }

        .modal-header {
            padding: 20px;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 600;
            color: #667eea;
        }

        .modal-close-btn {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #999;
            padding: 0;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-close-btn:hover {
            color: #333;
        }

        .modal-body {
            padding: 20px;
        }

        .pdf-container {
            width: 100%;
            height: 500px;
        }

        .pdf-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 10px;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @media (max-width: 480px) {
            .header {
                padding: 30px 20px;
            }

            .content {
                padding: 30px 20px;
            }

            h1 {
                font-size: 24px;
            }

            .profile-pic {
                width: 110px;
                height: 110px;
            }

            .contact-grid {
                grid-template-columns: 1fr;
            }

            .social-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .pdf-container {
                height: 400px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="profile-pic">
                <img src="profile.jpg" alt="Profile Picture" />
            </div>
            <h1>Filippov Danil</h1>
            <p class="title">Software Developer</p>
        </div>

        <div class="content">
            <!-- Contact Information -->
            <div class="section">
                <div class="section-title">📋 Contact</div>
                <div class="contact-grid">
                    <a href="mailto:gonilas@gmail.com" class="contact-item">
                        <span class="contact-icon">✉️</span>
                        <span class="contact-label">Email</span>
                        <span class="contact-value">gonilas@gmail.com</span>
                    </a>
                    <a href="tel:+8615063370375" class="contact-item">
                        <span class="contact-icon">📱</span>
                        <span class="contact-label">Phone / WeChat</span>
                        <span class="contact-value">+86 150 6337 0375</span>
                    </a>
                    <a href="https://wa.me/79113430063" class="contact-item">
                        <span class="contact-icon">💬</span>
                        <span class="contact-label">Telegram / WhatsApp</span>
                        <span class="contact-value">+7 911 343 0063</span>
                    </a>
                </div>
            </div>

            <!-- Social Links -->
            <div class="section">
                <div class="section-title">🔗 Connect</div>
                <div class="social-grid">
                    <a href="https://www.linkedin.com/in/filippovds/" target="_blank" class="social-link linkedin" title="LinkedIn">
                        <span>in</span>
                    </a>
                    <a href="https://t.me/dani_published" target="_blank" class="social-link telegram" title="Telegram">
                        <span>tg</span>
                    </a>
                </div>
            </div>

            <!-- WeChat QR Code -->
            <div class="section">
                <div class="section-title">WeChat</div>
                <div class="qr-container">
                    <div>
                        <img src="wechat-qr.jpg" alt="WeChat QR Code" class="qr-code" />
                        <div class="qr-label">ID: dani_published</div>
                    </div>
                </div>
            </div>

            <!-- Resume Section -->
            <div class="section">
                <a href="javascript:void(0)" onclick="openResumeModal()" class="btn">📄 View Resume</a>
            </div>
        </div>

        <div class="footer">
            <p>Built with ❤️ using GitHub Pages</p>
        </div>
    </div>

    <!-- Resume Modal -->
    <div id="resumeModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">Resume</div>
                <button class="modal-close-btn" onclick="closeResumeModal()">✕</button>
            </div>
            <div class="modal-body">
                <div class="pdf-container">
                    <iframe src="https://docs.google.com/gviz/secure/176ca8e8wvl2d85_/Filippov_Danil_Resume.pdf" type="application/pdf"></iframe>
                </div>
            </div>
        </div>
    </div>

    <script>
        function openResumeModal() {
            document.getElementById('resumeModal').classList.add('show');
        }

        function closeResumeModal() {
            document.getElementById('resumeModal').classList.remove('show');
        }

        // Close modal when clicking outside of it
        window.onclick = function(event) {
            const modal = document.getElementById('resumeModal');
            if (event.target == modal) {
                closeResumeModal();
            }
        }
    </script>
</body>
</html>
